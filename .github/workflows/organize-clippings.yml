name: 整理剪藏筆記

on:
  push:
    branches: [main]
    paths:
      - 'Clippings/**'
  workflow_dispatch:

jobs:
  trigger-knowledge-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: 找出待處理的剪藏檔案
        id: find_clippings
        run: |
          # 掃描 Clippings/ 下所有 .md（排除 README.md），不管是新增或修改
          PENDING_FILES=$(find Clippings/ -maxdepth 1 -name '*.md' ! -name 'README.md' 2>/dev/null || true)

          if [ -n "$PENDING_FILES" ]; then
            echo "has_pending_files=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              echo "$PENDING_FILES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_pending_files=false" >> "$GITHUB_OUTPUT"
            echo "Clippings/ 目前沒有待處理的剪藏，略過。"
          fi

      - name: 建立整理任務 Issue
        if: steps.find_clippings.outputs.has_pending_files == 'true'
        id: create_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES="${{ steps.find_clippings.outputs.files }}"
          DATE="$(date +%Y-%m-%d)"

          ISSUE_URL=$(gh issue create \
            --title "整理剪藏：${DATE} 新增剪藏待處理" \
            --body "## 任務說明

          偵測到 \`Clippings/\` 有新增剪藏，請依照 \`.github/agents/knowledge.agent.md\` 的完整流程（7 個步驟）逐一處理以下檔案，並建立 Pull Request。

          ## 待處理檔案

          \`\`\`
          ${FILES}
          \`\`\`

          ## 處理流程（請勿跳過任何步驟）

          1. 識別未處理的剪藏
          2. 分析內容、決定目標目錄（參照路由表）
          3. 補齊 YAML frontmatter（title, date, source, summary, key_points, tags, actionable）
          4. 正規化 Markdown 結構
          5. 重新命名檔案（\`YYYY-MM-DD - 中文標題.md\`）
          6. 將檔案從 \`Clippings/\` 搬移至正確目標目錄
          7. 更新 \`00-Home.md\` 與目標目錄的 \`README.md\`

          ## 完成後

          - Commit message 使用繁體中文（例：\`整理：整理剪藏文章與補齊 metadata\`）
          - PR 描述依照 \`.github/agents/knowledge.agent.md\` 的 Pull Request Summary 格式" \
            --repo "${{ github.repository }}")

          echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"
          ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -oE '[0-9]+$')
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "✅ Issue 建立成功：$ISSUE_URL"

      - name: 指派 Issue 給 Copilot coding agent
        if: steps.create_issue.outputs.issue_number != ''
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          ISSUE_NUM="${{ steps.create_issue.outputs.issue_number }}"
          GQL_HEADER="GraphQL-Features: issues_copilot_assignment_api_support,coding_agent_model_selection"

          if [ -z "$GH_PAT" ]; then
            echo "::warning::未設定 GH_PAT，略過自動指派。"
            exit 0
          fi

          # 1. 查詢 copilot-swe-agent bot ID 與 repo node ID
          QUERY_RESULT=$(GH_TOKEN="$GH_PAT" gh api graphql \
            --header "$GQL_HEADER" \
            --field "query=query { repository(owner: \"$OWNER\", name: \"$REPO_NAME\") { id suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 20) { nodes { login __typename ... on Bot { id } ... on User { id } } } } }" 2>&1)

          echo "suggestedActors 結果：$QUERY_RESULT"

          BOT_ID=$(echo "$QUERY_RESULT" | jq -r '.data.repository.suggestedActors.nodes[] | select(.login == "copilot-swe-agent") | .id' 2>/dev/null || true)
          REPO_ID=$(echo "$QUERY_RESULT" | jq -r '.data.repository.id' 2>/dev/null || true)

          if [ -z "$BOT_ID" ]; then
            echo "::warning::找不到 copilot-swe-agent，請確認帳號已啟用 Copilot cloud agent。"
            exit 0
          fi
          echo "✅ copilot-swe-agent ID: $BOT_ID，Repo ID: $REPO_ID"

          # 2. 取得 Issue node ID
          ISSUE_NODE_ID=$(GH_TOKEN="$GH_PAT" gh api graphql \
            --field "query=query { repository(owner: \"$OWNER\", name: \"$REPO_NAME\") { issue(number: $ISSUE_NUM) { id } } }" \
            --jq '.data.repository.issue.id' 2>&1)
          echo "Issue node ID: $ISSUE_NODE_ID"

          # 3. 指派給 copilot-swe-agent，並指定 custom instructions
          CUSTOM_INSTRUCTIONS="請依照 .github/agents/knowledge.agent.md 定義的 7 步驟流程處理 Clippings/ 下的剪藏：1)識別未處理檔案 2)分析內容決定目標目錄 3)補齊 YAML frontmatter 4)正規化 Markdown 5)重新命名 6)搬移至目標目錄 7)更新 00-Home.md 與 README。最後建立繁體中文 commit message 的 Pull Request。"

          ASSIGN_RESULT=$(GH_TOKEN="$GH_PAT" gh api graphql \
            --header "$GQL_HEADER" \
            --field "query=mutation { addAssigneesToAssignable(input: { assignableId: \"$ISSUE_NODE_ID\", assigneeIds: [\"$BOT_ID\"], agentAssignment: { targetRepositoryId: \"$REPO_ID\", baseRef: \"main\", customInstructions: \"$CUSTOM_INSTRUCTIONS\" } }) { assignable { ... on Issue { number assignees(first:5) { nodes { login } } } } } }" 2>&1)

          echo "指派結果：$ASSIGN_RESULT"
          echo "$ASSIGN_RESULT" | jq -e '.data.addAssigneesToAssignable' > /dev/null \
            && echo "✅ 成功指派給 Copilot coding agent" \
            || echo "::warning::GraphQL 指派失敗，請手動在 Issue 上指派給 Copilot。"

