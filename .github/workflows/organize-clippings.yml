name: 整理剪藏筆記

on:
  push:
    branches: [main]
    paths:
      - 'Clippings/**'
  workflow_dispatch:

jobs:
  trigger-knowledge-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: 找出待處理的剪藏檔案
        id: find_clippings
        run: |
          # 掃描 Clippings/ 下所有 .md（排除 README.md），不管是新增或修改
          PENDING_FILES=$(find Clippings/ -maxdepth 1 -name '*.md' ! -name 'README.md' 2>/dev/null || true)

          if [ -n "$PENDING_FILES" ]; then
            echo "has_pending_files=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              echo "$PENDING_FILES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_pending_files=false" >> "$GITHUB_OUTPUT"
            echo "Clippings/ 目前沒有待處理的剪藏，略過。"
          fi

      - name: 建立整理任務 Issue
        if: steps.find_clippings.outputs.has_pending_files == 'true'
        id: create_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES="${{ steps.find_clippings.outputs.files }}"
          DATE="$(date +%Y-%m-%d)"

          ISSUE_URL=$(gh issue create \
            --title "整理剪藏：${DATE} 新增剪藏待處理" \
            --body "## 任務說明

          偵測到 \`Clippings/\` 有新增剪藏，請依照 \`.github/agents/knowledge.agent.md\` 的完整流程（7 個步驟）逐一處理以下檔案，並建立 Pull Request。

          ## 待處理檔案

          \`\`\`
          ${FILES}
          \`\`\`

          ## 處理流程（請勿跳過任何步驟）

          1. 識別未處理的剪藏
          2. 分析內容、決定目標目錄（參照路由表）
          3. 補齊 YAML frontmatter（title, date, source, summary, key_points, tags, actionable）
          4. 正規化 Markdown 結構
          5. 重新命名檔案（\`YYYY-MM-DD - 中文標題.md\`）
          6. 將檔案從 \`Clippings/\` 搬移至正確目標目錄
          7. 更新 \`00-Home.md\` 與目標目錄的 \`README.md\`

          ## 完成後

          - Commit message 使用繁體中文（例：\`整理：整理剪藏文章與補齊 metadata\`）
          - PR 描述依照 \`.github/agents/knowledge.agent.md\` 的 Pull Request Summary 格式" \
            --repo "${{ github.repository }}")

          echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"
          ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -oE '[0-9]+$')
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "✅ Issue 建立成功：$ISSUE_URL"

      - name: 指派 Issue 給 Copilot（需要 GH_PAT 與 Copilot coding agent）
        if: steps.create_issue.outputs.issue_number != ''
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM="${{ steps.create_issue.outputs.issue_number }}"
          REPO="${{ github.repository }}"

          # 用 Classic PAT 透過 GraphQL 指派給 Copilot coding agent
          if [ -n "$GH_PAT" ]; then
            GH_TOKEN="$GH_PAT" gh issue edit "$ISSUE_NUM" \
              --add-assignee "copilot" \
              --repo "$REPO" \
              && echo "✅ 已成功指派給 Copilot" && exit 0 \
              || echo "::warning::指派失敗（可能仍是 fine-grained PAT），改用留言觸發..."
          fi

          # Fallback：在 Issue 留言 @copilot
          gh issue comment "$ISSUE_NUM" \
            --body "@copilot 請依照 \`.github/agents/knowledge.agent.md\` 的完整流程處理 Clippings/ 中的待整理剪藏，並建立 Pull Request。" \
            --repo "$REPO" \
            && echo "✅ 已留言 @copilot 觸發 agent" \
            || echo "::warning::留言失敗，請手動至 Issue 指派給 Copilot。"

