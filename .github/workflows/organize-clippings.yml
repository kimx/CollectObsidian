name: 整理剪藏筆記

on:
  push:
    branches: [main]
    paths:
      - 'Clippings/**'

jobs:
  trigger-knowledge-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: 找出待處理的剪藏檔案
        id: find_clippings
        run: |
          # 掃描 Clippings/ 下所有 .md（排除 README.md），不管是新增或修改
          PENDING_FILES=$(find Clippings/ -maxdepth 1 -name '*.md' ! -name 'README.md' 2>/dev/null || true)

          if [ -n "$PENDING_FILES" ]; then
            echo "has_pending_files=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              echo "$PENDING_FILES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_pending_files=false" >> "$GITHUB_OUTPUT"
            echo "Clippings/ 目前沒有待處理的剪藏，略過。"
          fi

      - name: 建立整理任務 Issue
        if: steps.find_clippings.outputs.has_pending_files == 'true'
        env:
          # 需要 PAT（Personal Access Token）才能指派 Issue 給 Copilot
          # 請至 repo Settings > Secrets > Actions 新增名為 GH_PAT 的 secret
          # PAT 需有 repo 範圍權限（repo:write 或 public_repo）
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::未設定 GH_PAT secret！"
            echo "::error::請至 repo Settings > Secrets > Actions 新增 Personal Access Token，命名為 GH_PAT，需有 repo 權限。"
            echo "::error::GITHUB_TOKEN 無法指派 Issue 給 Copilot，必須使用 PAT。"
            exit 1
          fi
          FILES="${{ steps.find_clippings.outputs.files }}"
          DATE="$(date +%Y-%m-%d)"

          gh issue create \
            --title "整理剪藏：${DATE} 新增剪藏待處理" \
            --body "## 任務說明

          偵測到 \`Clippings/\` 有新增剪藏，請依照 \`.github/agents/knowledge.agent.md\` 的完整流程（7 個步驟）逐一處理以下檔案，並建立 Pull Request。

          ## 待處理檔案

          \`\`\`
          ${FILES}
          \`\`\`

          ## 處理流程（請勿跳過任何步驟）

          1. 識別未處理的剪藏
          2. 分析內容、決定目標目錄（參照路由表）
          3. 補齊 YAML frontmatter（title, date, source, summary, key_points, tags, actionable）
          4. 正規化 Markdown 結構
          5. 重新命名檔案（\`YYYY-MM-DD - 中文標題.md\`）
          6. 將檔案從 \`Clippings/\` 搬移至正確目標目錄
          7. 更新 \`00-Home.md\` 與目標目錄的 \`README.md\`

          ## 完成後

          - Commit message 使用繁體中文（例：\`整理：整理剪藏文章與補齊 metadata\`）
          - PR 描述依照 \`.github/agents/knowledge.agent.md\` 的 Pull Request Summary 格式" \
            --assignee "copilot" \
            --repo "${{ github.repository }}"
